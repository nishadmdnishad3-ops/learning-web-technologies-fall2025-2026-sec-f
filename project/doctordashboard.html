<!DOCTYPE html>
<html>
<head>
    <title>Doctor Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 class="dotted" align="center">Doctor Dashboard</h1>

    <form align="center">
        <fieldset>
            <legend style="color: red;">Dashboard Overview</legend>

            <table class="tablelayout">

                <tr>
                    <td><label>Upcoming Appointments:</label></td>
                    <td><button type="button">View Appointments</button></td>
                </tr>

                <tr>
                    <td><label>Patient Reports:</label></td>
                    <td><button type="button">View Reports</button></td>
                </tr>

                <tr>
                    <td><label>Search Patient:</label></td>
                    <td><button type="button">Search</button></td>
                </tr>

                <tr>
                    <td><label>Daily Auto Refresh:</label></td>
                    <td><span>Every 24 Hours</span></td>
                </tr>

                <tr>
                    <td><label>Manual Refresh:</label></td>
                    <td><button type="button" onclick="location.reload()">Refresh</button></td>
                </tr>

            </table>

        </fieldset>
    </form>

</body>

    <footer>
        <h1 style="background-color: black; color: white;" align="Center"><b>Thanks for your support</b></h1>
    </footer>

</html>
