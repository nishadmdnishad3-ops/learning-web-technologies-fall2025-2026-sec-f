<!DOCTYPE html>
<html>
<head>
    <title>Doctor Registration & Verification</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--form action="doctorregistrationverification.php" method="post" enctype="multipart/form-data"-->


    <h1 class="dotted" align="center">Doctor Registration & Verification</h1>

    <form align="center" onsubmit="validateForm(event)">
        <fieldset>
            <legend style="color: red;">Doctor Verification Form</legend>

            <table class="tablelayout">

                <tr>
                    <td><label for="name">Name:</label></td>
                    <td><input id="name" type="text"></td>
                </tr>

                <tr>
                    <td><label for="license">License No:</label></td>
                    <td><input id="license" type="text"></td>
                </tr>

                <tr>
                    <td><label for="proof">License Proof:</label></td>
                    <td><input id="proof" type="file" accept=".jpg,.png,.jpeg,.pdf"></td>
                </tr>

                <tr>
                    <td></td>
                    <td>
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reload">
                    </td>
                </tr>

            </table>

        </fieldset>
    </form>
