<!DOCTYPE html>
<html>
<head>
    
    <title>Doctor Verification (Admin)</title>
    <link rel="stylesheet" href="style.css">
    
</head>

<body>

    <h1 class="dotted" align="center">Doctor Verification</h1>

    <form align="center">
        <fieldset>
            <legend style="color: red;">Admin Verification Panel</legend>

            <table class="tablelayout">

                <tr>
                    /
                </tr>

                <tr>
                    <td>Dr. Tarique jamil</td>
                    <td>LIC-12983</td>
                    <td id="status1">Pending</td>
                    <td>
                        <button type="button" onclick="approve('status1')">Approve</button> 
                        <br><br>
                        <button type="button" onclick="reject('status1')">Reject</button>
                    </td>
                </tr>

                <tr>
                    <td>Dr. Sara Rahman</td>
                    <td>LIC-88371</td>
                    <td id="status2">Pending</td>
                    <td>
                        <button type="button" onclick="approve('status2')">Approve</button>
                        <br><br>
                        <button type="button" onclick="reject('status2')">Reject</button>
                    </td>
                </tr>

                <tr>
                    <td>Dr. Habib Hasan</td>
                    <td>LIC-55002</td>
                    <td id="status3">Pending</td>
                    <td>
                        <button type="button" onclick="approve('status3')">Approve</button>
                        <br><br>
                        <button type="button" onclick="reject('status3')">Reject</button>
                    </td>
                </tr>

            </table>

        </fieldset>
    </form>

    <script>
        function approve(id) {
            document.getElementById(id).textContent = "Approved";
            document.getElementById(id).className = "approved";
            alert("Doctor Approved Successfully.");
        }

        function reject(id) {
            document.getElementById(id).textContent = "Rejected";
            document.getElementById(id).className = "rejected";
            alert("Doctor Rejected.");
        }
    </script>

</body>

<footer>
        <h1 style="background-color: black; color: white;" align="Center"><b>Thanks for your support</b></h1>
</footer>

</html>
